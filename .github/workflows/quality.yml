name: quality

on:
  push:
    branches: [main, feature/complete-bcm-catalog]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:frontend
      - run: npm run build
      - run: npm run prisma:validate
      - run: npm run prisma:generate

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: E2E database not configured
        if: ${{ env.TEST_DATABASE_URL == '' }}
        run: echo "TEST_DATABASE_URL secret is not configured; integration UI suite is skipped."
      - name: Install dependencies
        if: ${{ env.TEST_DATABASE_URL != '' }}
        run: npm ci
      - name: Install Chromium
        if: ${{ env.TEST_DATABASE_URL != '' }}
        run: npx playwright install --with-deps chromium
      - name: Apply test migrations
        if: ${{ env.TEST_DATABASE_URL != '' }}
        run: npm run prisma:test:migrate
      - name: Run browser E2E
        if: ${{ env.TEST_DATABASE_URL != '' }}
        run: npm run test:e2e
      - name: Upload UI QA artifacts
        if: ${{ always() && env.TEST_DATABASE_URL != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: bcm-ui-qa
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
