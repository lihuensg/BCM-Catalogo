name: quality

on:
  push:
    branches: [main, feature/complete-bcm-catalog]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:frontend
      - run: npm run build
      - run: npm run prisma:validate
      - run: npm run prisma:generate

  database-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bcm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bcm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bcm_test
      TEST_DATABASE_ONLY: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply test migrations
        run: npm run prisma:test:migrate
      - name: Run PostgreSQL integration suite
        run: npm run test:integration
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser E2E
        run: npm run test:e2e
      - name: Upload UI QA artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: bcm-ui-qa
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
