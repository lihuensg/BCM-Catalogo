name: quality

on:
  push:
    branches: [main, feature/complete-bcm-catalog]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:frontend
      - run: npm run build
      - run: npm run prisma:validate
      - run: npm run prisma:generate
